name: MyProject CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "MyProject/**"
      - "MyProjectUI/**"
      - ".github/workflows/myproject-ci.yml"
  pull_request:
    paths:
      - "MyProject/**"
      - "MyProjectUI/**"
      - ".github/workflows/myproject-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyProject

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore
        run: dotnet restore HWDemo.sln

      - name: Build
        run: dotnet build HWDemo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test App.Tests/App.Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Check JS client syntax
        run: node --check ../MyProjectUI/app.js

      - name: Build backend Docker image
        run: docker build -f Dockerfile .

      - name: Build client Docker image
        run: docker build -f ../MyProjectUI/Dockerfile ../MyProjectUI
