services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hwdemo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hwdemo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-hwdemo};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      DataInitialization__DropDatabase: ${DATAINIT_DROP_DATABASE:-false}
      DataInitialization__MigrateDatabase: ${DATAINIT_MIGRATE_DATABASE:-true}
      DataInitialization__SeedIdentity: ${DATAINIT_SEED_IDENTITY:-true}
      DataInitialization__SeedData: ${DATAINIT_SEED_DATA:-true}
      JWT__Key: ${JWT__Key:-some_secret_password_dont_share.at.iausdhviushviusdhuisdhgiusdfhliuhdiufvhidufvhidufhviudsfh}
      JWT__Issuer: ${JWT__Issuer:-itcollege.taltech.ee}
      JWT__Audience: ${JWT__Audience:-itcollege.taltech.ee}
      LangStrDefaultCulture: ${LangStrDefaultCulture:-en}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:8081}
    ports:
      - "${WEBAPP_PORT:-8080}:8080"

  client:
    build:
      context: ../MyProjectUI
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - webapp
    ports:
      - "${CLIENT_PORT:-8081}:80"

volumes:
  postgres-data:
