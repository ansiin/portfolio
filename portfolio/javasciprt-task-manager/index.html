<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Task Manager</h1>

      <div class="controls">
        <button id="addTaskBtn">Add New Task</button>
        <button id="clearTasksBtn">Clear All Tasks</button>
      </div>

      <div class="search-section">
        <input type="text" id="searchInput" placeholder="Search tasks..." />
        <button id="searchBtn">Search</button>
      </div>

      <div class="filter-section">
        <h3>Filters</h3>
        <div class="filter-grid">
          <div class="form-group">
            <label for="statusFilter">Status:</label>
            <select id="statusFilter">
              <option value="">All</option>
              <option value="todo">Todo</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="form-group">
            <label for="priorityFilter">Priority:</label>
            <select id="priorityFilter">
              <option value="">All</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="dueDateFilter">Due Date:</label>
            <input type="date" id="dueDateFilter" />
          </div>
          <div class="form-group">
            <label for="tagsFilter">Tags:</label>
            <input type="text" id="tagsFilter" placeholder="Comma-separated" />
          </div>
        </div>
        <div style="margin-top: 15px">
          <button id="applyFiltersBtn">Apply Filters</button>
          <button id="clearFiltersBtn">Clear Filters</button>
        </div>
      </div>

      <div class="task-list" id="taskList">
        <!-- Tasks will be dynamically inserted here -->
      </div>
    </div>

    <div id="taskModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add New Task</h2>
        <form id="taskForm">
          <input type="hidden" id="taskId" />
          <div class="form-group">
            <label for="taskTitle">Title:</label>
            <input type="text" id="taskTitle" required />
          </div>
          <div class="form-group">
            <label for="taskDescription">Description:</label>
            <textarea id="taskDescription"></textarea>
          </div>
          <div class="form-group">
            <label for="taskStatus">Status:</label>
            <select id="taskStatus">
              <option value="todo">Todo</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskPriority">Priority:</label>
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDueDate">Due Date:</label>
            <input type="date" id="taskDueDate" />
          </div>
          <div class="form-group">
            <label for="taskTags">Tags:</label>
            <input type="text" id="taskTags" placeholder="Comma-separated" />
          </div>
          <div class="form-group">
            <button type="submit">Save</button>
            <button type="button" id="cancelBtn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
