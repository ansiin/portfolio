[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "andres"
version = "0.1.0"
description = "Simple string transformation package for reversing strings."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Andre" }
]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent"
]

[tool.setuptools.packages.find]
where = ["src"]
