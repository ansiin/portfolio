worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream vue_task_manager {
        server vue-task-manager:80;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location /javascript-task-manager/ {
            try_files $uri $uri/ /javascript-task-manager/index.html;
        }

        location /typescript-task-manager/ {
            try_files $uri $uri/ /typescript-task-manager/index.html;
        }

        location /vue-task-manager/ {
            proxy_pass http://vue_task_manager/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
